<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gull Cove Inn | A day at the harbour</title>
<meta name="description" content="A concept site for a harbour inn. An illustrated scene runs a full day and night as you drag the clock: the sky, sun, moon, stars, lighthouse and windows all respond.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="brand">Gull Cove <i>Inn</i></span>
  <span class="note">Concept inn · not a real hotel</span>
</header>

<main class="wrap">
  <h1>A day at the <i>harbour.</i></h1>
  <p class="lead" id="lead"></p>

  <figure class="scene" id="scene">
    <svg viewBox="0 0 1200 640" role="img" aria-label="An illustrated harbour with an inn, a lighthouse and a boat. The sky changes with the time of day." preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sea1)"/><stop offset="1" style="stop-color:var(--sea2)"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
        <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff2b0" stop-opacity=".85"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></linearGradient>
      </defs>

      <rect width="1200" height="640" fill="url(#sky)"/>
      <g id="stars"></g>
      <g id="sunG"><circle r="120" fill="url(#glow)"/><circle id="sun" r="42" fill="#ffd45e"/></g>
      <g id="moonG"><circle r="90" fill="url(#glow)" opacity=".45"/><circle r="32" fill="#f3f0e2"/><circle cx="-9" cy="-6" r="6" fill="#d7d3c0"/><circle cx="10" cy="9" r="4" fill="#d7d3c0"/></g>

      <g id="clouds" style="fill:var(--cloud)">
        <g class="cloud c1"><ellipse cx="200" cy="130" rx="70" ry="22"/><ellipse cx="245" cy="118" rx="46" ry="20"/><ellipse cx="160" cy="120" rx="40" ry="16"/></g>
        <g class="cloud c2"><ellipse cx="760" cy="90" rx="86" ry="24"/><ellipse cx="810" cy="76" rx="52" ry="22"/><ellipse cx="715" cy="80" rx="44" ry="18"/></g>
        <g class="cloud c3"><ellipse cx="1000" cy="190" rx="60" ry="18"/><ellipse cx="1036" cy="180" rx="38" ry="16"/></g>
      </g>

      <path d="M0 380 L120 330 L230 372 L380 300 L520 370 L640 330 L780 380 L900 340 L1040 372 L1200 330 L1200 420 L0 420Z" style="fill:var(--hill)"/>
      <rect y="400" width="1200" height="240" fill="url(#sea)"/>
      <g id="reflect"><ellipse id="refl" cx="0" cy="0" rx="26" ry="150" fill="#ffe9a0" opacity="0"/></g>
      <g class="waves w1" style="stroke:var(--wave)"><path d="M-100 440 q50-12 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></g>
      <g class="waves w2" style="stroke:var(--wave)"><path d="M-100 490 q50-14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></g>
      <g class="waves w3" style="stroke:var(--wave)"><path d="M-100 550 q50-16 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0"/></g>

      <!-- lighthouse on the rocks -->
      <g id="lighthouse">
        <path d="M930 440 q40-60 120-30 l20 30z" style="fill:var(--rock)"/>
        <path d="M968 416 L984 250 L1016 250 L1032 416Z" fill="#f4efe6"/>
        <path d="M973 372 L977 340 L1023 340 L1027 372Z" fill="#cf4a3c"/><path d="M979 310 L982 280 L1018 280 L1021 310Z" fill="#cf4a3c"/>
        <rect x="980" y="236" width="40" height="16" fill="#3a3f55"/>
        <rect x="986" y="214" width="28" height="24" id="lamp" style="fill:var(--lamp)"/>
        <path d="M980 214 L1000 192 L1020 214Z" fill="#3a3f55"/>
        <g id="beamG" transform="translate(1000 226)"><g class="beam"><path d="M0 0 L640 -60 L640 60Z" fill="url(#beam)" transform="scale(-1 1)"/><path d="M0 0 L640 -60 L640 60Z" fill="url(#beam)"/></g></g>
      </g>

      <!-- the inn -->
      <g id="inn">
        <path d="M60 470 L60 360 L330 360 L330 470Z" style="fill:var(--wall)"/>
        <path d="M44 362 L195 290 L346 362Z" fill="#8a3b2e"/>
        <rect x="262" y="298" width="22" height="40" fill="#6b3226"/>
        <g class="win"><rect x="86" y="386" width="46" height="46" rx="3"/><rect x="156" y="386" width="46" height="46" rx="3"/><rect x="226" y="386" width="46" height="46" rx="3"/></g>
        <rect x="284" y="410" width="30" height="60" rx="3" fill="#4a2a20"/>
        <circle cx="195" cy="330" r="14" class="winc"/>
        <rect x="60" y="468" width="270" height="10" style="fill:var(--rock)"/>
      </g>

      <!-- boat -->
      <g class="boat"><g class="bob">
        <path d="M600 520 L720 520 L700 552 L622 552Z" fill="#c9553d"/>
        <path d="M660 520 L660 436" stroke="#5a4636" stroke-width="4"/>
        <path d="M664 440 L664 514 L716 514Z" fill="#f6efe0"/><path d="M656 450 L656 514 L616 514Z" fill="#ead9bd"/>
      </g></g>
    </svg>
    <figcaption class="hud"><span id="clock">12:00</span><span id="phase">Midday</span></figcaption>
  </figure>

  <div class="ctrl">
    <button id="play" aria-pressed="false">Play the day</button>
    <label class="slider"><span aria-hidden="true">☀</span>
      <input id="t" type="range" min="0" max="1439" value="720" aria-label="Time of day">
      <span aria-hidden="true">☾</span></label>
  </div>
  <p class="foot">Gull Cove Inn is a concept page made to show a parametric illustrated scene. Not a real hotel.</p>
</main>

<script src="app.js"></script>
</body>
</html>
