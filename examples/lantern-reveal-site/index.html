<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Night Gallery | Bring a lantern</title>
<meta name="description" content="A concept museum site in the dark. Your cursor is a flickering lantern; only what it lights is visible. Find all eight artefacts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="hall" id="hall" aria-label="A dark gallery. Move your cursor to light it.">
  <div class="layer dim" id="dim" aria-hidden="true"></div>
  <div class="layer lit" id="lit"></div>

  <header class="top">
    <span class="brand">The Night Gallery</span>
    <span class="found" id="found">0 of 8 found</span>
  </header>

  <section class="intro" id="intro">
    <h1>Bring a <i>lantern.</i></h1>
    <p>The gallery is closed and the lights are off. Move your cursor to see. Hold down to burn brighter.</p>
  </section>

  <footer class="bar" id="bar"><span id="info">Concept museum · not a real gallery</span></footer>
</main>

<noscript><p style="color:#fff;padding:20px">The Night Gallery needs JavaScript to light the lantern. It is a concept page about eight imaginary artefacts.</p></noscript>
<script src="app.js"></script>
</body>
</html>
