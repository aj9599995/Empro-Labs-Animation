<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pigment &amp; Pail | Twelve paints, one wall</title>
<meta name="description" content="A concept site for a small paint company. Filter the swatches and they glide to new places; open one and its colour fills the screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Familjen+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#">Pigment <i>&amp;</i> Pail</a>
  <p class="note">Concept brand · not a real shop</p>
</header>

<main>
  <section class="intro">
    <h1>Twelve paints.<br><i>One wall.</i></h1>
    <p>Small-batch wall paint, mixed by hand. Pick a family, then open a colour.</p>
    <div class="filters" id="filters" role="group" aria-label="Colour family">
      <button class="on" data-f="all">All</button>
      <button data-f="warm">Warm</button>
      <button data-f="cool">Cool</button>
      <button data-f="neutral">Neutral</button>
    </div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<div class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sname">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <div class="sheet-in">
    <p class="fam" id="sfam"></p>
    <h2 id="sname"></h2>
    <p class="hex" id="shex"></p>
    <p class="desc" id="sdesc"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
