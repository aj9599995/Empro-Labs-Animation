<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Orrery | A planetarium in your browser</title>
<meta name="description" content="A concept planetarium site. Six planets orbit on true relative year lengths; speed up time, click a planet and the camera flies after it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;800&family=Manrope:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="space" id="space">
  <svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An animated solar system with six orbiting planets">
    <defs>
      <radialGradient id="sunG"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffd25e"/><stop offset="1" stop-color="#ff9a1f" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="cam">
      <g id="orbits"></g>
      <circle r="160" fill="url(#sunG)" opacity=".55"/>
      <circle r="34" fill="#ffd25e"/>
      <g id="planets"></g>
    </g>
  </svg>

  <header class="top">
    <span class="brand">The Orrery</span>
    <span class="note">Concept planetarium · orbits not to scale in distance</span>
  </header>

  <aside class="panel" id="panel">
    <p class="kick" id="pk">Overview</p>
    <h1 id="pn">Six worlds, one star</h1>
    <p id="pd">Choose a planet to follow it around the Sun. Year lengths are real, so the inner planets lap the outer ones.</p>
    <dl id="stats" class="stats"></dl>
  </aside>

  <nav class="dock" id="dock" aria-label="Planets">
    <button data-i="-1" class="on">All</button>
  </nav>

  <div class="ctrl">
    <button id="play" aria-pressed="true">Pause</button>
    <label>Time <input id="speed" type="range" min="0" max="2.6" step="0.01" value="1.3" aria-label="Time speed"><output id="rate"></output></label>
    <span class="clock" id="clock">Day 0</span>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
